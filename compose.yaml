services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: PracticeVaultAPI/Dockerfile
    depends_on:
      database:
        condition: service_started
        required: true
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=PracticeVaultDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "8081:8080"

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - practicevault-data:/var/opt/mssql

volumes:
  practicevault-data: